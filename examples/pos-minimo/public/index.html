<!doctype html><html lang="es"><meta charset="utf-8"><title>POS minimo</title>
<style>body{font-family:system-ui;max-width:700px;margin:40px auto}label{display:block;margin:12px 0}input,select,button{padding:10px}pre{white-space:pre-wrap}</style>
<h1>Punto de venta</h1><form id="sale"><label>Producto <select data-testid="product" required></select></label>
<label>Cantidad <input data-testid="quantity" type="number" min="1" step="1" value="1" required></label>
<label>Pago en pesos <input data-testid="paid" type="number" min="0" step="0.01" required></label>
<button data-testid="sell">Cobrar</button></form><pre data-testid="ticket" aria-live="polite"></pre>
<script type="module">
const control=id=>document.querySelector(`[data-testid="${id}"]`);
async function refresh(){const products=await(await fetch('/api/products')).json();control('product').replaceChildren(...products.map(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.name} — $${(p.priceCents/100).toFixed(2)} — stock ${p.stock}`;return o;}));}
document.querySelector('#sale').addEventListener('submit',async e=>{e.preventDefault();const button=control('sell');button.disabled=true;try{const body={key:crypto.randomUUID(),items:[{productId:Number(control('product').value),quantity:Number(control('quantity').value)}],paidCents:Math.round(Number(control('paid').value)*100)};const response=await fetch('/api/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();control('ticket').textContent=response.ok?`Folio: ${data.folio}\nTotal: ${data.totalCents} centavos\nCambio: ${data.changeCents} centavos`:data.error;await refresh();}catch{control('ticket').textContent='No se pudo completar el cobro';}finally{button.disabled=false;}});
await refresh();
</script></html>
