name: Validate candidate
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: |
          dotnet restore AgentLoop.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build AgentLoop.sln -c Release --no-restore
          exit $LASTEXITCODE
      - name: Local verifier (no remote LLM)
        shell: pwsh
        run: dotnet run --project tests/AgentLoop.SelfTests -c Release --no-build -- selftest
      - name: Architecture and credentials
        shell: pwsh
        run: |
          python scripts/audit-architecture.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit-git-secrets.py --output .agentloop/ci-secrets.json
          exit $LASTEXITCODE
      - name: Local packaging rehearsal
        shell: pwsh
        run: ./scripts/package-release.ps1 -AllowUnlicensedPreview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: candidate-reports
          path: |
            .agentloop/ci-secrets.json
            .agentloop/release/staging-*/package-audit.json
          if-no-files-found: ignore
          retention-days: 7
